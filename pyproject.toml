[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-analysis"
version = "0.1.0"
description = "Reference digital processing pipeline for long-wave infrared dual-comb spectroscopy"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
io = ["h5py>=3.8"]
spectroscopy = ["hapi>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
dcs = "dcs_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
